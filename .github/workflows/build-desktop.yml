name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-desktop

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
          TEMPLATES=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$TEMPLATES/version.txt" ]; then
            curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            mkdir -p "$TEMPLATES"
            # Keep only what desktop exports need, so the cache stays small.
            cp /tmp/templates/templates/version.txt "$TEMPLATES/"
            cp /tmp/templates/templates/windows_* "$TEMPLATES/"
            cp /tmp/templates/templates/macos.zip "$TEMPLATES/"
          fi
          ~/godot/godot --version

      - name: Level climb check (every side level can be crossed with Patch's reach)
        run: |
          python3 tools/levels/climb_check.py levels/thistledown/1_1_sodden_fields.txt levels/thistledown/1_2_the_sheepfold.txt levels/thistledown/1_4_the_millrace.txt levels/thistledown/1_5_the_mill_stair.txt levels/thistledown/hayloft.txt levels/lanternfold/2_1_the_drowned_quay.txt levels/lanternfold/2_2_the_lamplighters_climb.txt levels/lanternfold/2_4_the_shadow_wharf.txt levels/lanternfold/2_5_under_the_flap.txt levels/lanternfold/lightkeepers_store.txt levels/marsh/3_1_the_sump_road.txt levels/marsh/3_2_the_drowned_ledger.txt levels/marsh/3_5_the_herons_reach.txt levels/marsh/tally_room.txt levels/peaks/4_1_the_rime_slopes.txt levels/peaks/4_2_the_fold_works.txt levels/peaks/4_4_the_stitched_ascent.txt levels/peaks/4_5_the_low_point.txt levels/peaks/cold_store.txt levels/fair/5_1_the_midway.txt levels/fair/5_2_the_big_wheel.txt levels/fair/5_4_the_ghost_train.txt levels/fair/5_5_the_rigging.txt levels/fair/lost_property.txt levels/index/6_1_the_back_pages.txt levels/index/6_2_the_card_catalogue.txt levels/index/6_4_the_stacks.txt levels/index/6_5_the_gnawed_pages.txt levels/index/errata.txt levels/finale/f_1_the_gutter_descent.txt
          # The sluice house is a current puzzle, solved by its builder (fails unless it needs wheels 1 and 2).
          python3 tools/levels/build_marsh.py && git diff --exit-code levels/marsh
          # The Peaks: 4-2 needs the Frog Fold for its exit, and the pattern room's folds are solved by its builder.
          python3 tools/levels/build_peaks.py && git diff --exit-code levels/peaks
          # The Fair: the Gatefold's vent flaps are solved by its builder (five pulls, no shorter way),
          # and 5-1, 5-2, 5-4, 5-5 and Lost Property can't be finished without the glide.
          python3 tools/levels/build_fair.py && git diff --exit-code levels/fair
          # The Index: the spring shutters' tabs are reachable with the shutters down, and
          # the Reading Room's shutters are solved by its builder (two warps, four pulls).
          python3 tools/levels/build_index.py && git diff --exit-code levels/index
          # The Gutter: its chasm needs the updraft, the shutter needs the warp, and every wave lock is roofed.
          python3 tools/levels/build_gutter.py && git diff --exit-code levels/finale

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Combat test
        run: ~/godot/godot --headless --path . --script tools/godot/combat_test.gd

      - name: Smoke test
        run: ~/godot/godot --headless --path . --script tools/godot/smoke_test.gd

      - name: Export Windows (.exe)
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/PatchPopUpKingdom.exe
          test -s build/windows/PatchPopUpKingdom.exe

      - name: Export macOS (.app in .zip)
        run: |
          mkdir -p build/macos
          ~/godot/godot --headless --path . --export-release "macOS" build/macos/PatchPopUpKingdom.zip
          test -s build/macos/PatchPopUpKingdom.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PatchPopUpKingdom-windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: PatchPopUpKingdom-macos
          path: build/macos/PatchPopUpKingdom.zip
